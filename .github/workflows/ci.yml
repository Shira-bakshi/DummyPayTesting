name:  CI Tests


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read


jobs:
  test:
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: myEnvironment
    steps:
      - uses: actions/checkout@v5


      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip


      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Install Chromium
        run: playwright install --with-deps chromium


      - name: Run full test suite
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_RECIPIENT_EMAIL: ${{ secrets.TEST_RECIPIENT_EMAIL }}
          TEST_RECIPIENT_NAME: ${{ secrets.TEST_RECIPIENT_NAME }}        
        run:
            python -m pytest --strict-markers --html=reports/test-report.html --self-contained-html


      - name: Upload report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
